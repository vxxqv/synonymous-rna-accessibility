name: Verify exact computations
on:
  push:
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Inspect frozen folding configuration without computing features
        id: persist_config
        run: python -I -B analysis/programme/retrospective/persist_v2/feature_replay/diagnostics_v1/config_preflight.py --repo-root . --output "${{ runner.temp }}/persist-config-only"
      - name: Retain frozen configuration diagnostic
        if: ${{ always() && steps.persist_config.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: persist-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/persist-config-only/
          if-no-files-found: warn
          retention-days: 14
      - name: Test public reference functions
        run: python -m pytest tests -q
      - name: Independently check additive product queries
        run: python analysis/programme/product_closure_independent.py --outdir work/ci-product-independent
      - name: Check correlated uncertainty with an independent exact oracle
        run: python analysis/programme/affine_polytope/verify_exact.py --out work/ci-affine-polytope
      - name: Replay interaction certificates and independently checked counterexamples
        run: python -B analysis/programme/interaction_certificates/replay.py --out work/ci-interaction-certificates
      - name: Replay exact observation prices and optional batches
        run: python -I -B analysis/programme/observation_cost/replay.py --out work/ci-observation-cost
      - name: Independently replay frozen measured pilot
        run: python analysis/programme/retrospective/gill_result_independent.py --outdir work/ci-gill-independent
      - name: Check selective access and measurement calculations on synthetic inputs
        run: python -m pytest analysis/programme/retrospective/gill_multiclass_v1/implementation/test_gill_multiclass.py -q
      - name: Independently replay multiclass measurements and all normalization comparisons
        run: python analysis/programme/retrospective/gill_multiclass_v1/independent/replay.py --repo-root . --output "${{ runner.temp }}/ci-gill-multiclass"
      - name: Independently replay all frozen full-length reporter predictions
        run: python -I -B analysis/programme/retrospective/persist_v2/independent_replay/replay.py --repo . --out "${{ runner.temp }}/ci-persist-independent"
      - name: Check frozen folding replay guards
        run: python -I -B analysis/programme/retrospective/persist_v2/feature_replay/check_guards.py --output "${{ runner.temp }}/ci-persist-feature-guards"
      - name: Replay the frozen full-length reporter sequence features
        id: persist_features
        run: python -I -B analysis/programme/retrospective/persist_v2/feature_replay/replay.py --repo-root . --output "${{ runner.temp }}/ci-persist-features"
      - name: Expose frozen feature failure diagnostics
        if: ${{ always() && steps.persist_features.outcome == 'failure' }}
        run: python -I -B analysis/programme/retrospective/persist_v2/feature_replay/diagnostics_v1/observe_failure.py --root "${{ runner.temp }}/ci-persist-features"
      - name: Retain frozen feature failure evidence
        if: ${{ always() && steps.persist_features.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: persist-feature-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-persist-features/
          if-no-files-found: warn
          retention-days: 14
      - name: Replay exact CNOT3 source diagnosis without network or Git
        run: python -I -B analysis/programme/retrospective/cnot3_v2_exploratory/source_diagnosis/portable_replay/replay.py --repo . --out "${{ runner.temp }}/ci-cnot3-source"
      - name: Check CNOT3 numerical replay guards
        run: python -I -B analysis/programme/retrospective/cnot3_v2_exploratory/final_numerical_replay/test_replay.py
      - name: Independently replay all CNOT3 predictions and scored diagnostics
        id: cnot3_numerical
        run: python -I -B analysis/programme/retrospective/cnot3_v2_exploratory/final_numerical_replay/replay.py --archive-root . --out "${{ runner.temp }}/ci-cnot3-numerical"
      - name: Retain CNOT3 numerical replay evidence
        if: ${{ always() && steps.cnot3_numerical.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: cnot3-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-cnot3-numerical/
          if-no-files-found: warn
          retention-days: 14
      - name: Independently replay both joint-function pilot arms
        id: joint_function
        run: |
          python -I -B analysis/cycle5/observed_result_review/verify_observed.py --authorization analysis/cycle5/cambray_pilot/authorization_development_independent_check.json --root . --out "${{ runner.temp }}/cycle5-development-core"
          python -I -B analysis/cycle5/observed_result_review/verify_observed.py --authorization analysis/cycle5/cambray_pilot/authorization_reserved_validation_independent_check.json --root . --out "${{ runner.temp }}/cycle5-reserved-core"
          python -I -B analysis/cycle5/replay_supplement_reviews.py --repo . --arm development --out "${{ runner.temp }}/cycle5-development-supplement"
          python -I -B analysis/cycle5/replay_supplement_reviews.py --repo . --arm reserved_validation --out "${{ runner.temp }}/cycle5-reserved-supplement"
      - name: Independently replay complete FAS measurements and certificates
        run: python -I -B analysis/cycle6/result_reviews/replay.py --repo . --out "${{ runner.temp }}/cycle6-fas-independent"
      - name: Independently verify all FAS robustness boundaries and omissions
        run: python -I -B analysis/cycle7/robustness_result_review/verify_portable.py --repo . --out "${{ runner.temp }}/cycle7-fas-robustness"
      - name: Independently reconstruct every joint-scenario FAS route interval
        run: python -I -B analysis/cycle7/scenario_result_review/verify_observed.py --repo . --out "${{ runner.temp }}/cycle7-fas-scenarios"
      - name: Retain joint-function pilot verification
        if: ${{ always() && steps.joint_function.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: cycle5-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cycle5-*/
          if-no-files-found: warn
          retention-days: 14
      - name: Independently replay frozen synthetic predictions
        run: python analysis/verify_prediction_pilot.py
      - name: Replay finite exact verification
        run: python analysis/exact/run_final_audit.py --out verification-ci-register
      - name: Check exact spectral certificates
        run: python analysis/exact/check_automata_certificates.py
      - name: Verify general constraints and additive counterexamples
        run: python analysis/expansion/verification/run_verification.py --outdir results/expansion/verification-ci-general
      - name: Check Boolean feasibility compiler
        run: python analysis/expansion/verification/verify_feasibility_2sat.py --outdir results/expansion/verification-ci-feasibility
