name: Verify exact computations
on:
  push:
  workflow_dispatch:
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Test public reference functions
        run: python -m pytest tests -q
      - name: Independently replay frozen synthetic predictions
        run: python analysis/verify_prediction_pilot.py
      - name: Replay finite exact verification
        run: python analysis/exact/run_final_audit.py --out verification-ci-register
      - name: Check exact spectral certificates
        run: python analysis/exact/check_automata_certificates.py
      - name: Verify general constraints and additive counterexamples
        run: python analysis/expansion/verification/run_verification.py --outdir results/expansion/verification-ci-general
      - name: Check Boolean feasibility compiler
        run: python analysis/expansion/verification/verify_feasibility_2sat.py --outdir results/expansion/verification-ci-feasibility
